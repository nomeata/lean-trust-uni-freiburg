<svg viewBox="0 0 1600 874" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="The con-leche family of checkers. con-leche: a cached checker refines a fueled pure checker, which bridges to relational rules, sound for a set-theoretic model; it runs on Lean&#x27;s compiler and runtime. con-ron: Rust code, via an Aeneas translation, refines a Lean twin that refines con-leche&#x27;s pure checker. con-agua: x86 assembly from a verified compiler, against Kraken&#x27;s x86 semantics, refines L code that refines con-ron&#x27;s twin." font-family="'Source Sans 3', 'Helvetica Neue', Arial, sans-serif">
