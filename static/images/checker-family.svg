<text x="800.0" y="74" font-size="21" font-weight="400" fill="#64748b" text-anchor="middle">in Rust</text>
<text x="1370.0" y="44" font-size="32" font-weight="700" fill="#0f172a" text-anchor="middle">con-agua</text>
<text x="1370.0" y="74" font-size="21" font-weight="400" fill="#64748b" text-anchor="middle">in x86 assembly</text>
